<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Roll Up · Stanmore GC · 5 Nov 2026</title>
<link rel="icon" href="club-logo.png">
<link rel="apple-touch-icon" href="club-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,500&family=Poppins:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --navy-deep:#0a1428; --navy:#122344; --navy-mid:#1e3d70;
    --gold:#f0c040; --gold-dk:#d4a017; --gold-lt:#ffe066;
    --green:#4ade80; --red:#f87171; --blue:#60a5fa;
    --text:#f5f5f7; --text-mut:#9ba3b4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:var(--text);font-family:'Poppins',sans-serif;font-size:16px;line-height:1.45;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(240,192,64,.08),transparent 60%);pointer-events:none;z-index:0;}
  a{color:var(--gold-lt);}

  .wrap{max-width:720px;margin:0 auto;position:relative;z-index:1;padding-bottom:40px;}
  .wrap.tv{max-width:none;padding:0 20px 20px;}

  /* Header */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(240,192,64,.2);backdrop-filter:blur(10px);position:sticky;top:0;background:rgba(10,20,40,.85);z-index:30;}
  .hdr-brand{display:flex;align-items:center;gap:10px;}
  .hdr-logo{width:36px;height:36px;object-fit:contain;}
  .hdr-title{font-family:'Playfair Display',serif;font-weight:800;font-size:1rem;line-height:1;background:linear-gradient(135deg,var(--gold-dk),var(--gold-lt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .hdr-sub{font-size:.68rem;color:var(--text-mut);letter-spacing:.08em;margin-top:3px;}
  .hdr-chip{font-size:.68rem;padding:4px 10px;border-radius:14px;background:rgba(240,192,64,.1);border:1px solid rgba(240,192,64,.3);color:var(--gold-lt);font-weight:600;}

  /* Hero */
  .hero{padding:22px 16px 16px;text-align:center;}
  .hero-crest{width:70px;height:70px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(240,192,64,.3));}
  .hero-title{font-family:'Playfair Display',serif;font-weight:900;font-size:1.9rem;line-height:1;background:linear-gradient(135deg,var(--gold-dk),var(--gold-lt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.01em;}
  .hero-sub{color:var(--text-mut);font-size:.86rem;margin-top:8px;letter-spacing:.04em;}
  .hero-meta{display:inline-flex;gap:12px;margin-top:14px;padding:8px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(240,192,64,.25);border-radius:20px;font-size:.78rem;color:var(--gold-lt);font-weight:600;}

  /* Nav */
  .nav{display:flex;margin:16px 12px 10px;background:rgba(0,0,0,.3);border-radius:12px;padding:4px;gap:4px;}
  .nav-item{flex:1;padding:11px 10px;text-align:center;border-radius:9px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--text-mut);transition:all .15s;text-decoration:none;}
  .nav-item.active{background:linear-gradient(135deg,var(--gold-dk),var(--gold));color:var(--navy);font-weight:800;box-shadow:0 2px 10px rgba(240,192,64,.3);}

  /* Card */
  .view{padding:0 12px;}
  .card{background:linear-gradient(180deg,rgba(30,61,112,.3),rgba(18,35,68,.3));border:1px solid rgba(240,192,64,.2);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(10,20,40,.4);}
  .card-h{font-family:'Playfair Display',serif;font-weight:800;font-size:1.05rem;color:var(--gold-lt);margin-bottom:12px;display:flex;align-items:center;gap:8px;}

  /* Leaderboard */
  .lb{width:100%;border-collapse:collapse;}
  .lb thead th{text-align:left;font-size:.68rem;letter-spacing:.1em;color:var(--gold-lt);font-weight:700;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid rgba(240,192,64,.3);}
  .lb thead th.r{text-align:right;} .lb thead th.c{text-align:center;}
  .lb tbody td{padding:10px 6px;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,.05);}
  .lb tbody td.r{text-align:right;font-family:'DM Mono',monospace;font-weight:700;}
  .lb tbody td.c{text-align:center;font-family:'DM Mono',monospace;font-weight:600;}
  .lb .pos{font-family:'Playfair Display',serif;font-weight:800;font-size:1.05rem;color:var(--gold);width:36px;}
  .lb .pts{font-family:'DM Mono',monospace;font-weight:700;color:var(--text);font-size:.95rem;}
  .lb .diff{font-family:'Playfair Display',serif;font-weight:900;font-size:1.4rem;}
  .diff-pos{color:var(--green);} .diff-neg{color:var(--red);} .diff-ev{color:var(--gold-lt);}
  .gchip{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(96,165,250,.2);color:var(--blue);font-size:.6rem;font-weight:800;margin-left:5px;letter-spacing:.05em;vertical-align:middle;}
  .lb tr.top1 td{background:rgba(240,192,64,.08);}
  .lb tr.top1 .pos{font-size:1.3rem;color:var(--gold-lt);}

  /* Forms */
  .inp{width:100%;padding:10px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;}
  .inp:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.5);}
  .btn{padding:10px 16px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.86rem;transition:all .15s;}
  .btn-gold{background:linear-gradient(135deg,var(--gold-dk),var(--gold));color:var(--navy);}
  .btn-gold:hover{box-shadow:0 4px 14px rgba(240,192,64,.4);}
  .btn-out{background:transparent;border:1px solid rgba(240,192,64,.4);color:var(--gold-lt);}
  .btn-ghost{background:rgba(255,255,255,.05);color:var(--text-mut);}
  .btn-dnr{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3);}

  /* Group editor */
  .grp{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:12px;}
  .grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  .grp-tee{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold-lt);font-size:1.05rem;}
  .grp-slot{display:grid;grid-template-columns:1.6fr .7fr 1fr 80px;gap:6px;margin-bottom:6px;align-items:center;}
  .grp-slot .mkr{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--text-mut);justify-content:center;cursor:pointer;}
  .grp-share{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}

  /* Save status */
  .save-pill-wrap{margin:0 12px 10px;padding:10px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .save-pill-text{font-size:.72rem;font-family:DM Mono,monospace;color:var(--text-mut);}
  .save-pill{opacity:0;transition:opacity .3s;background:linear-gradient(135deg,var(--green),#22c55e);color:#022e0f;font-size:.78rem;font-weight:800;padding:6px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(74,222,128,.4);}
  .save-pill.err{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;}
  .save-pill.show{opacity:1;}

  /* Score entry */
  .se-head{position:sticky;top:66px;background:rgba(10,20,40,.9);backdrop-filter:blur(10px);padding:14px 16px;border-bottom:1px solid rgba(240,192,64,.25);z-index:20;margin:0 -12px 10px;}
  .se-grp{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold-lt);font-size:1rem;}
  .se-hole{text-align:center;padding:14px 0 10px;}
  .se-hole-n{font-family:'Playfair Display',serif;font-weight:900;font-size:3rem;line-height:1;background:linear-gradient(135deg,var(--gold-dk),var(--gold-lt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .se-hole-meta{color:var(--text-mut);font-size:.82rem;margin-top:4px;}
  .se-player{background:rgba(30,61,112,.3);border:1px solid rgba(240,192,64,.2);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}
  .se-pname{font-weight:700;font-size:1rem;}
  .se-psub{font-size:.7rem;color:var(--text-mut);margin-top:3px;}
  .se-pdots{color:var(--gold);font-weight:700;}
  .se-pscore{display:flex;gap:8px;align-items:center;}
  .se-inp{width:62px;height:56px;text-align:center;font-size:1.5rem;font-weight:800;background:rgba(0,0,0,.5);border:2px solid rgba(240,192,64,.3);border-radius:10px;color:var(--text);font-family:inherit;}
  .se-inp:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.7);}
  .se-pts{min-width:28px;text-align:center;font-family:'DM Mono',monospace;font-weight:800;color:var(--gold-lt);font-size:1rem;}
  .se-nav{display:flex;gap:8px;margin:16px 0;}
  .se-nav .btn{flex:1;padding:14px;font-size:.95rem;}
  .se-ntp{margin-top:10px;padding:12px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.3);border-radius:10px;}
  .se-ntp-label{font-size:.74rem;color:var(--blue);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
  .se-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:6px 0;}
  .se-hole-btn{padding:9px 2px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:6px;text-align:center;cursor:pointer;font-size:.78rem;color:var(--text-mut);font-weight:600;}
  .se-hole-btn.done{color:var(--green);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08);}
  .se-hole-btn.cur{background:linear-gradient(135deg,var(--gold-dk),var(--gold));color:var(--navy);font-weight:800;border-color:var(--gold);}

  /* TV */
  .tv-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:linear-gradient(90deg,rgba(240,192,64,.08),transparent);border-bottom:2px solid rgba(240,192,64,.3);}
  .tv-brand{display:flex;align-items:center;gap:16px;}
  .tv-logo{width:60px;height:60px;}
  .tv-title{font-family:'Playfair Display',serif;font-weight:900;font-size:2.4rem;background:linear-gradient(135deg,var(--gold-dk),var(--gold-lt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .tv-sub{color:var(--text-mut);font-size:1rem;margin-top:4px;}
  .tv-updated{font-family:DM Mono,monospace;color:var(--gold-lt);font-size:.9rem;text-align:right;}
  .tv-rotator{color:var(--text-mut);font-size:.75rem;}
  .tv-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px;}
  .tv-main{background:rgba(0,0,0,.3);border:1px solid rgba(240,192,64,.2);border-radius:14px;padding:20px;}
  .tv-side{display:flex;flex-direction:column;gap:16px;}
  .tv-panel{background:rgba(0,0,0,.3);border:1px solid rgba(240,192,64,.2);border-radius:14px;padding:16px;}
  .tv-panel h3{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold-lt);margin-bottom:12px;font-size:1.2rem;}
  .tv-lb{width:100%;border-collapse:collapse;}
  .tv-lb th{text-align:left;color:var(--gold-lt);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 8px;border-bottom:2px solid rgba(240,192,64,.3);font-weight:700;}
  .tv-lb th.r{text-align:right;} .tv-lb th.c{text-align:center;}
  .tv-lb td{padding:12px 8px;font-size:1.1rem;border-bottom:1px solid rgba(255,255,255,.06);}
  .tv-lb td.r{text-align:right;font-family:'DM Mono',monospace;font-weight:700;}
  .tv-lb td.c{text-align:center;font-family:'DM Mono',monospace;font-weight:600;}
  .tv-lb .pos{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold);font-size:1.3rem;}
  .tv-lb .pts{font-family:'DM Mono',monospace;font-weight:700;color:var(--text);font-size:1.1rem;}
  .tv-lb .diff{font-family:'Playfair Display',serif;font-weight:900;font-size:1.8rem;}
  .tv-lb tr.top1 td{background:rgba(240,192,64,.1);}
  .tv-lb tr.top1 .pos{font-size:1.6rem;color:var(--gold-lt);}
  .tv-lb tr.top1 .diff{font-size:2.4rem;}
  .tv-ntp-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:1rem;}
  .tv-ntp-hole{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold);}
  .tv-ntp-name{font-weight:600;color:var(--text);}
  .tv-ntp-empty{color:var(--text-mut);font-style:italic;font-size:.9rem;}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-c{background:var(--navy);border:1px solid rgba(240,192,64,.4);border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center;}
  .modal-c h2{font-family:'Playfair Display',serif;color:var(--gold-lt);margin-bottom:4px;font-size:1.3rem;}
  .modal-c .sub{color:var(--text-mut);font-size:.86rem;margin-bottom:16px;}
  #qrbox{background:white;padding:14px;border-radius:10px;display:inline-block;margin:10px 0;}
  .modal-link{word-break:break-all;background:rgba(0,0,0,.4);padding:10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:.76rem;margin:10px 0;color:var(--gold-lt);}

  @media (max-width:600px){
    .grp-slot{grid-template-columns:1.3fr .6fr .9fr 70px;font-size:.86rem;}
    .hero-title{font-size:1.6rem;}
  }
  @media (min-width:800px){
    .hero-crest{width:130px;height:130px;}
    .hero-title{font-size:2.8rem;}
    .hero-sub{font-size:1rem;margin-top:12px;}
    .hero-meta{font-size:.9rem;padding:10px 18px;}
    .hdr-logo{width:50px;height:50px;}
    .hdr-title{font-size:1.3rem;}
    .hdr-sub{font-size:.78rem;}
  }
  @media (max-width:1000px){
    .tv-grid{grid-template-columns:1fr;}
  }

  /* Scorer pickers */
  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:6px;}
  .pick-card{background:rgba(0,0,0,.3);border:1px solid rgba(240,192,64,.2);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;}
  .pick-card:hover{border-color:var(--gold);background:rgba(240,192,64,.08);}
  .pick-tee{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold-lt);font-size:1.3rem;margin-bottom:6px;}
  .pick-names{color:var(--text);font-size:.86rem;line-height:1.4;}
  .pick-empty{color:var(--text-mut);font-style:italic;font-size:.82rem;}
  .pick-player{display:block;background:rgba(0,0,0,.3);border:1px solid rgba(240,192,64,.25);border-radius:12px;padding:16px 18px;margin-bottom:8px;cursor:pointer;transition:all .15s;text-align:left;width:100%;color:var(--text);font-family:inherit;}
  .pick-player:hover{border-color:var(--gold);background:rgba(240,192,64,.08);}
  .pick-player-n{font-weight:700;font-size:1.1rem;}
  .pick-player-s{font-size:.76rem;color:var(--text-mut);margin-top:3px;}
  .scorer-ident{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(240,192,64,.08);border:1px solid rgba(240,192,64,.25);border-radius:10px;margin:0 0 10px;font-size:.78rem;}
  .scorer-ident-me{color:var(--gold-lt);font-weight:700;}

  /* Printable sign */
  html.print-mode,html.print-mode body{background:#fff !important;}
  .print-tools .btn-out{color:#122344;border-color:#d4a017;}
  body.print-mode::before{display:none;}
  body.print-mode .demo-banner{display:none;}
  .print-tools{display:flex;gap:8px;justify-content:center;padding:14px;}
  .print-sheet{background:#fff;color:#122344;max-width:700px;margin:0 auto 30px;padding:36px 48px;border:3px solid #d4a017;border-radius:6px;text-align:center;font-family:'Poppins',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .print-logo{width:110px;height:110px;object-fit:contain;}
  .print-title{font-family:'Playfair Display',serif;font-weight:900;font-size:3rem;color:#122344;line-height:1;margin-top:10px;}
  .print-sub{font-size:1.05rem;color:#555;margin-top:8px;letter-spacing:.04em;}
  .print-rule{height:3px;background:linear-gradient(90deg,transparent,#d4a017,transparent);margin:22px 0;}
  .print-h{font-family:'Playfair Display',serif;font-weight:800;font-size:1.6rem;color:#122344;margin-bottom:14px;}
  .print-qr{display:inline-block;padding:12px;border:2px solid #122344;border-radius:8px;background:#fff;}
  .print-qr img,.print-qr canvas{display:block;margin:0 auto;}
  .print-url{font-family:'DM Mono',monospace;font-size:.78rem;color:#555;margin-top:10px;word-break:break-all;}
  .print-steps{text-align:left;max-width:520px;margin:22px auto 0;font-size:1.05rem;line-height:1.6;color:#122344;padding-left:24px;}
  .print-steps li{margin-bottom:6px;}
  .print-foot{margin-top:22px;font-size:.88rem;color:#555;font-style:italic;line-height:1.5;}
  #qrbox img,#qrbox canvas{display:block;margin:0 auto;}
  @media print{
    @page{size:A4 portrait;margin:12mm;}
    .print-tools,.demo-banner{display:none !important;}
    html,body{background:#fff !important;}
    body::before{display:none !important;}
    .print-sheet{margin:0 auto;}
  }

  /* Expandable scorecard */
  .lb-row{cursor:pointer;}
  .lb-row:hover td{background:rgba(240,192,64,.06);}
  .lb-row.open td{background:rgba(240,192,64,.1);}
  .chev{color:var(--text-mut);font-size:.7rem;margin-left:6px;}
  .lb-card-row > td{padding:0 !important;background:rgba(0,0,0,.3);}
  .sc-wrap{padding:12px 8px 14px;overflow-x:auto;cursor:default;}
  .sc-head{font-size:.8rem;color:var(--text-mut);margin-bottom:8px;}
  .sc-head b{color:var(--gold-lt);font-size:.9rem;}
  .sc-wrap .sc{width:100%;border-collapse:collapse;margin-bottom:8px;table-layout:fixed;min-width:310px;}
  .sc-wrap .sc th,.sc-wrap .sc td{padding:5px 1px;text-align:center;font-size:.78rem;font-family:'DM Mono',monospace;border:1px solid rgba(255,255,255,.08);background:none;}
  .sc-wrap .sc th:first-child,.sc-wrap .sc td:first-child{text-align:left;padding-left:6px;width:50px;font-family:'Poppins',sans-serif;color:var(--text-mut);font-weight:600;font-size:.72rem;}
  .sc-wrap .sc th:last-child,.sc-wrap .sc td:last-child{background:rgba(240,192,64,.08);font-weight:700;color:var(--gold-lt);width:38px;}
  .sc-wrap .sc-h th{background:rgba(240,192,64,.15);color:var(--gold-lt);font-weight:700;}
  .sc-wrap .sc-par td,.sc-wrap .sc-si td{color:var(--text-mut);}
  .sc-dot{display:block;color:var(--gold);line-height:.6;font-size:.75rem;}
  .sc-wrap .sc-g td{font-weight:700;color:var(--text);font-size:.9rem;}
  .sc-wrap .sc-p td{font-weight:700;}
  .sc-wrap .sc td.pt-good{background:rgba(74,222,128,.18);color:var(--green);font-weight:800;}
  .sc-wrap .sc td.pt-bog{color:var(--text-mut);}
  .sc-wrap .sc td.pt-zero{background:rgba(248,113,113,.15);color:var(--red);}
  .sc-foot{font-size:.82rem;color:var(--text);text-align:right;}
  .sc-key{color:var(--text-mut);font-size:.72rem;}
  .tv-lb .sc-wrap .sc th,.tv-lb .sc-wrap .sc td{font-size:1rem;padding:7px 3px;}

  /* Tee-time inputs in admin */
  .tee-inp{background:rgba(0,0,0,.35);border:1px solid rgba(240,192,64,.35);border-radius:6px;color:var(--gold-lt);font-family:'Playfair Display',serif;font-weight:800;font-size:1.05rem;padding:3px 6px;color-scheme:dark;}
  /* Groups board */
  .gb-sec{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin:14px 2px 8px;}
  .gb-sec:first-child{margin-top:0;}
  .gb-sec-inplay{color:var(--green);} .gb-sec-upcoming{color:var(--gold-lt);} .gb-sec-finished{color:var(--text-mut);}
  .gb-grp{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .gb-inplay{border-color:rgba(74,222,128,.35);box-shadow:inset 3px 0 0 var(--green);}
  .gb-finished{opacity:.75;}
  .gb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .gb-time{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold-lt);font-size:1.05rem;}
  .gb-badge{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:12px;}

  .gb-badge.soon{background:rgba(240,192,64,.12);color:var(--gold-lt);}
  .gb-p{display:grid;grid-template-columns:1fr 62px 58px 44px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.05);font-size:.88rem;}
  .gb-names{color:var(--text-mut);font-size:.88rem;line-height:1.5;}
  .gb-grp.tv .gb-names{font-size:1rem;}
  .gb-t{font-family:'DM Mono',monospace;color:var(--text-mut);font-size:.78rem;text-align:right;}
  .gb-pts{font-family:'DM Mono',monospace;font-weight:700;text-align:right;}
  .gb-d{font-family:'Playfair Display',serif;font-weight:900;font-size:1.1rem;text-align:right;}
  .gb-tvgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px;}
  .gb-tvgrid .gb-sec{grid-column:1/-1;font-size:.85rem;}
  .gb-grp.tv .gb-p{font-size:1.05rem;grid-template-columns:1fr 80px 70px 54px;}
  .gb-grp.tv .gb-time{font-size:1.25rem;}
  .gb-grp.tv .gb-d{font-size:1.35rem;}
</style>
</head>
<body>

<div id="root"></div>

<script>
/* =========================================================
   AUTUMN ROLL UP · STANMORE GC · THURSDAY 5 NOVEMBER 2026
   ========================================================= */

const APP_KEY  = 'autumn_rollup_2026';
const LOCAL_KEY = APP_KEY + '_local_v1';
const ADMIN_PW = 'Davospurs';
const SB_URL   = 'https://sysnimzmrnengwhdaiga.supabase.co';
const SB_KEY   = 'sb_publishable_WBgBahOK6tKSyxr5TG2tHQ_5BY79zpL';
const SB_HEADERS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type':'application/json' };

/* ---- Course: Stanmore ---- */
const COURSE = {
  par:      [4,4,4,3,4,3,4,3,4, 3,5,4,4,4,4,4,3,5],
  siMen:    [14,4,8,16,2,18,12,10,6, 17,5,7,1,15,3,11,9,13],
  siLadies: [12,4,8,18,2,16,10,14,6, 17,7,1,15,5,11,13,9,3], // back 9 last SI inferred — verify
  tees: {
    yellow: { name:'Yellow', total:5758, cr:68.8, slope:127, gender:'m' },
    red:    { name:'Red',    total:5385, cr:66.8, slope:121, gender:'w' }
  }
};
const PAR_TOTAL = COURSE.par.reduce((a,b)=>a+b,0);
const PAR3_HOLES = [4,6,8,10,17]; // 1-indexed
const DEFAULT_TEES = ['10:00','10:08','10:16','10:24','10:32','10:40','10:48','10:56'];

/* ---- State ---- */
let _state = { groups:[], ntp:{}, _savedAt:0 };
let _isAdmin = false;
let _currentView = 'leaderboard';
let _scoreGroupId = null;
let _scoreHoleIdx = 0;
let _tvRotateTimer = null;
let _tvRotateIdx = 0;
let _pubTimer = null;
let _saveTimer = null;
let _scorerSlot = null;

const SCORER_KEY = APP_KEY + '_scorer_identity';
function loadScorerIdentity() { try { return JSON.parse(localStorage.getItem(SCORER_KEY)||'null'); } catch(e) { return null; } }
function saveScorerIdentity(gid, slot) { try { localStorage.setItem(SCORER_KEY, JSON.stringify({groupId:gid, slot})); } catch(e){} _scoreGroupId = gid; _scorerSlot = slot; }
function clearScorerIdentity() { try { localStorage.removeItem(SCORER_KEY); } catch(e){} _scoreGroupId = null; _scorerSlot = null; _scoreHoleIdx = 0; }
function pickGroup(gid) { saveScorerIdentity(gid, null); renderAll(); }
function pickPlayer(slot) { const id = loadScorerIdentity()||{}; saveScorerIdentity(id.groupId, slot); renderAll(); }
function switchScorer() { if (confirm('Switch to a different group or player?')) { clearScorerIdentity(); renderAll(); } }

/* ---- Storage ---- */
async function loadState() {
  let remote = null;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/app_state?app_key=eq.${APP_KEY}&select=data`, { headers: SB_HEADERS });
    if (r.ok) { const rows = await r.json(); if (rows[0]) remote = rows[0].data; }
  } catch(e) { console.error('load', e); }
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch(e){}
  const rT = (remote && remote._savedAt)||0, lT = (local && local._savedAt)||0;
  let chosen = (lT > rT && local) ? local : remote;
  if (chosen) {
    _state = Object.assign({ groups:[], ntp:{}, _savedAt:0 }, chosen);
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(_state)); } catch(e){}
  }
  if (!_state.groups || !_state.groups.length) _initGroups();
  if (!_state.ntp) _state.ntp = {};
}

async function saveState() {
  _state._savedAt = Date.now();
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(_state)); } catch(e){}
  flashPill('Saving…', false);
  try {
    const r = await fetch(`${SB_URL}/rest/v1/app_state?on_conflict=app_key`, {
      method:'POST',
      headers: { ...SB_HEADERS, Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ app_key: APP_KEY, data:_state, updated_at:new Date().toISOString() })
    });
    if (r.ok) { flashPill('✓ Saved', false); return true; }
    flashPill('⚠ Local only', true); return false;
  } catch(e) { flashPill('⚠ Local only', true); return false; }
}

function debouncedSave() { clearTimeout(_saveTimer); _saveTimer = setTimeout(saveState, 400); }

function flashPill(text, isErr) {
  document.querySelectorAll('.save-pill').forEach(p => {
    p.textContent = text; p.classList.toggle('err', !!isErr); p.classList.add('show');
    clearTimeout(p._to); p._to = setTimeout(()=>p.classList.remove('show'), 2500);
  });
  document.querySelectorAll('.save-pill-text').forEach(l => {
    l.textContent = 'Last update: ' + new Date().toLocaleTimeString('en-GB');
  });
}

/* ---- Default groups ---- */
function _initGroups() {
  _state.groups = DEFAULT_TEES.map((t,i) => ({
    id: 'g'+i, teeTime: t, scorerSlot: 0,
    players: [0,1,2,3].map(() => ({
      name:'', hi:null, gender:'m', isGuest:false, isPro:false,
      scores: new Array(18).fill(null)
    }))
  }));
}

/* ---- Handicap maths ---- */
const teeKey = p => p.gender === 'w' ? 'red' : 'yellow';
const siArr  = p => p.gender === 'w' ? COURSE.siLadies : COURSE.siMen;
function calcPH(p) {
  if (p.isPro) return 0;
  if (p.hi == null || isNaN(p.hi)) return null;
  const tee = COURSE.tees[teeKey(p)];
  return Math.round((p.hi * (tee.slope/113) + (tee.cr - PAR_TOTAL)) * 0.95);
}
function shotsOnHole(ph, holeIdx, p) {
  if (ph == null || ph <= 0) return 0;
  const si = siArr(p)[holeIdx]; let s = 0;
  if (ph >= 18) s++;
  if (si <= (ph % 18)) s++;
  if (ph >= 36) s++;
  return s;
}
function stbPts(gross, par, shots) {
  if (!gross || gross <= 0) return 0;
  return Math.max(0, 2 + (par - (gross - shots)));
}
function playerPts(p) {
  const ph = calcPH(p); let total = 0, thru = 0;
  const perHole = [];
  for (let i=0; i<18; i++) {
    const g = p.scores[i];
    if (g != null && g > 0) {
      const pts = stbPts(g, COURSE.par[i], shotsOnHole(ph, i, p));
      perHole.push(pts); total += pts; thru = i+1;
    } else perHole.push(null);
  }
  return { total, thru, ph, perHole };
}

/* ---- Routing ---- */
function parseRoute() {
  const h = location.hash || '';
  if (h.startsWith('#/score')) {
    const m = h.match(/^#\/score\/(g\d+)/);
    if (m) { _scoreGroupId = m[1]; } // deep link still works
    _currentView = 'score'; return;
  }
  if (h === '#/tv') { _currentView = 'tv'; return; }
  if (h === '#/print') { _currentView = 'print'; return; }
  if (h === '#/admin') { _currentView = 'admin'; return; }
  _currentView = 'leaderboard';
}
window.addEventListener('hashchange', () => { parseRoute(); renderAll(); });

/* ---- Render root ---- */
function renderAll() {
  clearInterval(_tvRotateTimer); clearInterval(_pubTimer);
  document.body.classList.remove('print-mode'); document.documentElement.classList.remove('print-mode');
  const root = document.getElementById('root');
  if (_currentView === 'print') return renderPrint(root);
  if (_currentView === 'tv') return renderTV(root);
  if (_currentView === 'score') return renderScorer(root);
  if (_currentView === 'admin') return renderAdmin(root);
  renderLeaderboard(root);
}

/* ---- Leaderboard compute ---- */
function computeLeaderboard() {
  const all = [];
  _state.groups.forEach(g => g.players.forEach((p, si) => {
    if (!p.name) return;
    const pts = playerPts(p);
    const shots = COURSE.par.map((_, i) => shotsOnHole(pts.ph, i, p));
    all.push({ key:g.id+'-'+si, name:p.name, hi:p.hi, gender:p.gender, teeTime:g.teeTime,
               ph:pts.ph, thru:pts.thru, total:pts.total, isGuest:p.isGuest,
               perHole:pts.perHole, scores:p.scores.slice(), shots });
  }));
  // Diff vs level handicap = points above (positive) or below (negative) the par-net expectation.
  all.forEach(r => { r.diff = r.total - (2 * r.thru); });
  all.sort((a,b) => {
    if (b.diff !== a.diff) return b.diff - a.diff;        // 1st: better vs handicap wins
    if (b.total !== a.total) return b.total - a.total;    // 2nd: more total points wins
    const cb = (x,from,to) => x.perHole.slice(from,to+1).reduce((s,v)=>s+(v||0),0);
    const d9 = cb(b,9,17)-cb(a,9,17); if (d9) return d9;  // 3rd+: countback
    const d6 = cb(b,12,17)-cb(a,12,17); if (d6) return d6;
    const d3 = cb(b,15,17)-cb(a,15,17); if (d3) return d3;
    const d2 = cb(b,16,17)-cb(a,16,17); if (d2) return d2;
    return (b.perHole[17]||0)-(a.perHole[17]||0);
  });
  const played = all.filter(r => r.thru > 0);
  played.forEach((r,i) => r.pos = i+1);
  return played;
}
// Golf-style display: under handicap shows as negative (e.g. 3 pts ahead → "-3")
function fmtDiff(d) {
  if (d === 0) return 'E';
  return d > 0 ? '-' + d : '+' + Math.abs(d);
}
function diffCls(d) {
  if (d > 0) return 'diff-pos';
  if (d < 0) return 'diff-neg';
  return 'diff-ev';
}

/* ---- Public leaderboard ---- */
function renderLeaderboard(root) {
  const rows = computeLeaderboard();
  root.innerHTML = `
    <div class="wrap">
      ${headerHTML()}
      ${navHTML('leaderboard')}
      <div class="hero">
        <img class="hero-crest" src="club-logo.png" alt="" onerror="this.style.display='none'">
        <div class="hero-title">Autumn Roll Up</div>
        <div class="hero-sub">Stanmore Golf Club · Thursday 5 November 2026</div>
        <div class="hero-meta">⛳ Individual Stableford · 95%</div>
      </div>
      <div class="view">
        <div class="card">
          <div class="card-h">🏆 Overall Leaderboard</div>
          ${leaderboardTable(rows, false)}
        </div>
        ${groupsCard()}
        ${guestLeaderboardCard(rows)}
        ${ntpCard()}
        <div style="text-align:center;color:var(--text-mut);font-size:.75rem;margin-top:12px;">
          Live from scorer updates · <a href="#/tv">Open TV view</a>
        </div>
      </div>
    </div>`;
  _pubTimer = setInterval(async () => {
    if (_currentView !== 'leaderboard') return;
    const act = document.activeElement;
    if (act && ['INPUT','TEXTAREA','SELECT'].includes(act.tagName)) return;
    await loadState(); renderLeaderboard(root);
  }, 20000);
}

let _expanded = new Set();
function toggleCard(k) { if (_expanded.has(k)) _expanded.delete(k); else _expanded.add(k); renderAll(); }

function leaderboardTable(rows, isTV, ctx) {
  ctx = ctx || (isTV ? 'tv' : 'main');
  if (!rows.length) {
    return `<div style="text-align:center;color:var(--text-mut);padding:20px;font-style:italic;">No scores yet — leaderboard will fill as the groups play.</div>`;
  }
  const cls = isTV ? 'tv-lb' : 'lb';
  const trs = rows.map((r,i) => {
    const k = ctx + '|' + r.key;
    const open = _expanded.has(k);
    return `
    <tr class="lb-row${i===0?' top1':''}${open?' open':''}" onclick="toggleCard('${k}')">
      <td class="pos">${r.pos}</td>
      <td>${escH(r.name)}${r.isGuest?'<span class="gchip">G</span>':''}<span class="chev">${open?'▴':'▾'}</span></td>
      <td class="c">${r.ph!=null?r.ph:'—'}</td>
      <td class="c">${r.thru||'—'}</td>
      <td class="c pts">${r.total}</td>
      <td class="r diff ${diffCls(r.diff)}">${fmtDiff(r.diff)}</td>
    </tr>${open ? `<tr class="lb-card-row"><td colspan="6">${scorecardHTML(r)}</td></tr>` : ''}`;
  }).join('');
  return `<table class="${cls}">
    <thead><tr><th>Pos</th><th>Player</th><th class="c">PH</th><th class="c">Thru</th><th class="c">Pts</th><th class="r">vs HCP</th></tr></thead>
    <tbody>${trs}</tbody></table>
    <div style="font-size:.68rem;color:var(--text-mut);text-align:right;margin-top:6px;font-style:italic;">Tap a player to see their card · vs HCP: -3 = 3 under handicap (2 pts/hole = level). Countback on ties. Unofficial — physical card is the official score.</div>`;
}

function ptsCls(v) {
  if (v == null) return '';
  if (v >= 3) return 'pt-good';
  if (v === 1) return 'pt-bog';
  if (v === 0) return 'pt-zero';
  return '';
}
function scorecardHTML(r) {
  const si = r.gender === 'w' ? COURSE.siLadies : COURSE.siMen;
  const sum = a => a.reduce((s,v)=>s+(v||0),0);
  const half = from => {
    const idx = [0,1,2,3,4,5,6,7,8].map(k => from + k);
    const gross = idx.map(i => r.scores[i]);
    const pts = idx.map(i => r.perHole[i]);
    const any = gross.some(v => v != null);
    return `<table class="sc">
      <tr class="sc-h"><th>Hole</th>${idx.map(i=>`<th>${i+1}</th>`).join('')}<th>${from===0?'Out':'In'}</th></tr>
      <tr class="sc-par"><td>Par</td>${idx.map(i=>`<td>${COURSE.par[i]}</td>`).join('')}<td>${sum(idx.map(i=>COURSE.par[i]))}</td></tr>
      <tr class="sc-si"><td>SI</td>${idx.map(i=>`<td>${si[i]}${r.shots[i]?`<span class="sc-dot">${'•'.repeat(r.shots[i])}</span>`:''}</td>`).join('')}<td></td></tr>
      <tr class="sc-g"><td>Gross</td>${idx.map(i=>`<td>${r.scores[i]!=null?r.scores[i]:''}</td>`).join('')}<td>${any?sum(gross):''}</td></tr>
      <tr class="sc-p"><td>Pts</td>${idx.map(i=>`<td class="${ptsCls(r.perHole[i])}">${r.perHole[i]!=null?r.perHole[i]:''}</td>`).join('')}<td>${any?sum(pts):''}</td></tr>
    </table>`;
  };
  return `<div class="sc-wrap" onclick="event.stopPropagation()">
    <div class="sc-head"><b>${escH(r.name)}</b>${r.isGuest?' (Guest)':''} · ${r.teeTime} · HI ${r.hi!=null?r.hi:'—'} · PH ${r.ph!=null?r.ph:'—'} · ${r.gender==='w'?'Red':'Yellow'} tees</div>
    ${half(0)}${half(9)}
    <div class="sc-foot"><b>${r.total} pts</b> thru ${r.thru} · <span class="${diffCls(r.diff)}">${fmtDiff(r.diff)}</span> vs handicap · <span class="sc-key">• = shot received</span></div>
  </div>`;
}

function groupStatusList() {
  const out = [];
  _state.groups.forEach(g => {
    const named = g.players.filter(p => p.name);
    if (!named.length) return;
    const players = named.map(p => { const s = playerPts(p); return { name:p.name, isGuest:p.isGuest, thru:s.thru, total:s.total, diff:s.total - 2*s.thru }; });
    const maxThru = Math.max(...players.map(x => x.thru));
    const status = maxThru === 0 ? 'upcoming' : (players.every(x => x.thru === 18) ? 'finished' : 'inplay');
    out.push({ teeTime:g.teeTime, players, maxThru, status });
  });
  const rank = { inplay:0, upcoming:1, finished:2 };
  out.sort((a,b) => rank[a.status] - rank[b.status] || a.teeTime.localeCompare(b.teeTime));
  return out;
}
function groupsBoardHTML(isTV) {
  const list = groupStatusList();
  if (!list.length) return `<div style="text-align:center;color:var(--text-mut);padding:16px;font-style:italic;">No groups set up yet.</div>`;
  const label = { inplay:'On the course', upcoming:'Still to tee off', finished:'Finished' };
  let lastStatus = null, out = '';
  list.forEach(g => {
    if (g.status !== lastStatus) { out += `<div class="gb-sec gb-sec-${g.status}">${label[g.status]}</div>`; lastStatus = g.status; }
    const badge = g.status === 'inplay' ? `<span class="gb-badge live">● Thru ${g.maxThru}</span>`
                : g.status === 'finished' ? `<span class="gb-badge done">✓ Finished</span>`
                : `<span class="gb-badge soon">Tees off ${g.teeTime}</span>`;
    const rows = g.status === 'upcoming'
      ? `<div class="gb-names">${g.players.map(x => escH(x.name) + (x.isGuest?'<span class="gchip">G</span>':'')).join(' · ')}</div>`
      : g.players.map(x => `<div class="gb-p"><span class="gb-n">${escH(x.name)}${x.isGuest?'<span class="gchip">G</span>':''}</span>
           <span class="gb-t">${x.thru ? 'Thru ' + x.thru : '—'}</span>
           <span class="gb-pts">${x.total} pts</span>
           <span class="gb-d ${diffCls(x.diff)}">${fmtDiff(x.diff)}</span></div>`).join('');
    out += `<div class="gb-grp gb-${g.status}${isTV?' tv':''}">
      <div class="gb-h"><span class="gb-time">⛳ ${g.teeTime}</span>${badge}</div>${rows}</div>`;
  });
  return `<div class="gb${isTV?' gb-tvgrid':''}">${out}</div>`;
}
function groupsCard() {
  return `<div class="card"><div class="card-h">🕐 Tee Times &amp; Groups</div>${groupsBoardHTML(false)}</div>`;
}

function guestLeaderboardCard(rows) {
  const guests = rows.filter(r => r.isGuest).map((r,i)=>({...r,pos:i+1}));
  if (!guests.length) return '';
  return `<div class="card"><div class="card-h">⭐ Best Guest</div>${leaderboardTable(guests,false,'guest')}</div>`;
}
function ntpCard() {
  const rows = PAR3_HOLES.map(h => {
    const n = _state.ntp[h];
    return `<div class="tv-ntp-row">
      <span class="tv-ntp-hole">Hole ${h} (Par 3)</span>
      ${n ? `<span class="tv-ntp-name">${escH(n)}</span>` : '<span class="tv-ntp-empty">—</span>'}
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-h">🎯 Nearest the Pin</div>${rows}</div>`;
}

/* ---- Scorer (dispatcher + pickers + entry) ---- */
function renderScorer(root) {
  // Resume from saved identity if present
  const id = loadScorerIdentity();
  if (id && id.groupId) { _scoreGroupId = id.groupId; _scorerSlot = (id.slot != null ? id.slot : null); }

  // No group chosen → group picker
  if (!_scoreGroupId) return renderGroupPicker(root);
  const grp = _state.groups.find(g => g.id === _scoreGroupId);
  if (!grp) { clearScorerIdentity(); return renderGroupPicker(root); }

  // No player chosen → player picker
  if (_scorerSlot == null || !grp.players[_scorerSlot] || !grp.players[_scorerSlot].name) {
    return renderPlayerPicker(root, grp);
  }
  renderScoreEntry(root, grp);
}

function renderGroupPicker(root) {
  const cards = _state.groups.map(g => {
    const names = g.players.filter(p => p.name).map(p => escH(p.name));
    const body = names.length ? `<div class="pick-names">${names.join(' · ')}</div>` : `<div class="pick-empty">No players set up yet</div>`;
    return `<div class="pick-card" onclick="pickGroup('${g.id}')">
      <div class="pick-tee">⛳ ${g.teeTime}</div>
      ${body}
    </div>`;
  }).join('');
  root.innerHTML = `<div class="wrap">
    ${headerHTML()}
    <div class="hero">
      <img class="hero-crest" src="club-logo.png" alt="" onerror="this.style.display='none'">
      <div class="hero-title">Scorer Sign-In</div>
      <div class="hero-sub">Pick your tee-time group to start marking.</div>
    </div>
    <div class="view">
      <div class="card">
        <div class="card-h">👥 Which group are you in?</div>
        <div class="pick-grid">${cards}</div>
      </div>
      <div style="text-align:center;color:var(--text-mut);font-size:.78rem;margin-top:12px;">
        <a href="#/">View leaderboard</a>
      </div>
    </div>
  </div>`;
}

function renderPlayerPicker(root, grp) {
  const rows = grp.players.map((p, slot) => {
    if (!p.name) return '';
    return `<button class="pick-player" onclick="pickPlayer(${slot})">
      <div class="pick-player-n">${escH(p.name)}${p.isGuest?'<span class="gchip">G</span>':''}</div>
      <div class="pick-player-s">${p.gender==='w'?'Red tees':'Yellow tees'}${p.hi!=null?` · HI ${p.hi}`:''}</div>
    </button>`;
  }).join('');
  root.innerHTML = `<div class="wrap">
    ${headerHTML()}
    <div class="hero">
      <div class="hero-title">⛳ ${grp.teeTime}</div>
      <div class="hero-sub">Who's doing the scoring?</div>
    </div>
    <div class="view">
      <div class="card">
        <div class="card-h">👤 Pick your name</div>
        ${rows || `<div class="pick-empty" style="padding:20px;text-align:center;">No players set up for this group yet. Ask Alex.</div>`}
      </div>
      <div style="text-align:center;margin-top:10px;">
        <button class="btn btn-ghost" onclick="clearScorerIdentity();renderAll();">← Pick a different group</button>
      </div>
    </div>
  </div>`;
}

function renderScoreEntry(root, grp) {
  const h = _scoreHoleIdx, par = COURSE.par[h], isPar3 = par === 3;

  const holeGrid = [0,1].map(half => `
    <div class="se-grid">${[0,1,2,3,4,5,6,7,8].map(k => {
      const idx = half*9+k;
      const named = grp.players.filter(p => p.name);
      const allDone = named.length>0 && named.every(p => p.scores[idx] != null);
      const cls = idx === h ? 'cur' : (allDone ? 'done' : '');
      return `<div class="se-hole-btn ${cls}" onclick="pickHole(${idx})">${idx+1}</div>`;
    }).join('')}</div>`).join('');

  const playerCards = grp.players.map((p, slot) => {
    if (!p.name) return '';
    const ph = calcPH(p);
    const shots = shotsOnHole(ph, h, p);
    const g = p.scores[h];
    const pts = g ? stbPts(g, par, shots) : null;
    const dots = shots > 0 ? '•'.repeat(shots) : '';
    return `<div class="se-player">
      <div>
        <div class="se-pname">${escH(p.name)}${p.isGuest?'<span class="gchip">G</span>':''}</div>
        <div class="se-psub">PH ${ph!=null?ph:'—'}${dots?` · <span class="se-pdots">${dots}</span>`:''}</div>
      </div>
      <div class="se-pscore">
        <input class="se-inp" inputmode="numeric" pattern="[0-9]*" maxlength="2"
               data-slot="${slot}" value="${g!=null?g:''}"
               onfocus="this.select()" oninput="scorerInput(this)" onkeydown="scorerKey(event,this)">
        <span class="se-pts">${pts!=null?pts:'—'}</span>
      </div>
    </div>`;
  }).join('');

  const ntpBlock = isPar3 ? `
    <div class="se-ntp">
      <div class="se-ntp-label">🎯 Nearest the Pin on hole ${h+1}?</div>
      <select class="inp" onchange="setNTP(${h+1}, this.value)">
        <option value="">— no claim yet —</option>
        ${grp.players.filter(p=>p.name).map(p => `<option value="${escH(p.name)}" ${_state.ntp[h+1]===p.name?'selected':''}>${escH(p.name)}</option>`).join('')}
      </select>
      <div style="font-size:.68rem;color:var(--text-mut);margin-top:6px;">Markers are also on the green — latest tap wins.</div>
    </div>` : '';

  root.innerHTML = `
    <div class="wrap">
      ${headerHTML()}
      <div class="save-pill-wrap">
        <div class="save-pill-text">Group ${grp.teeTime}</div>
        <span class="save-pill">—</span>
      </div>
      <div class="view">
        <div class="scorer-ident">
          <div>Signed in as <span class="scorer-ident-me">${escH(grp.players[_scorerSlot].name)}</span></div>
          <button class="btn btn-ghost" style="padding:5px 10px;font-size:.72rem;" onclick="switchScorer()">Switch</button>
        </div>
        <div class="se-head">
          <div class="se-grp">⛳ Your Group · ${grp.teeTime}</div>
          <div style="font-size:.75rem;color:var(--text-mut);margin-top:3px;">
            ${grp.players.filter(p=>p.name).map(p=>escH(p.name)).join(' · ') || '(no players set up yet)'}
          </div>
        </div>
        ${holeGrid}
        <div class="se-hole">
          <div class="se-hole-n">${h+1}</div>
          <div class="se-hole-meta">Par ${par} · SI ${COURSE.siMen[h]}${isPar3?' · 🎯 Par 3':''}</div>
        </div>
        ${playerCards || `<div style="text-align:center;padding:20px;color:var(--text-mut);font-style:italic;">No players set up for this group yet.</div>`}
        ${ntpBlock}
        <div class="se-nav">
          <button class="btn btn-ghost" onclick="pickHole(${Math.max(0,h-1)})" ${h===0?'disabled':''}>◀ Prev</button>
          <button class="btn btn-gold" onclick="pickHole(${Math.min(17,h+1)})" ${h===17?'disabled':''}>Next ▶</button>
        </div>
        <div style="text-align:center;padding:14px;color:var(--text-mut);font-size:.78rem;">
          Scores save automatically · <a href="#/">View leaderboard</a>
        </div>
      </div>
    </div>`;
}

function scorerInput(el) {
  const slot = +el.dataset.slot;
  const grp = _state.groups.find(g => g.id === _scoreGroupId);
  const v = el.value.replace(/[^0-9]/g,'').slice(0,2);
  el.value = v;
  grp.players[slot].scores[_scoreHoleIdx] = v ? +v : null;
  const row = el.closest('.se-player');
  const par = COURSE.par[_scoreHoleIdx];
  const p = grp.players[slot];
  const shots = shotsOnHole(calcPH(p), _scoreHoleIdx, p);
  const pts = v ? stbPts(+v, par, shots) : null;
  row.querySelector('.se-pts').textContent = pts!=null?pts:'—';
  debouncedSave();
  if (v.length === 2) {
    const inputs = Array.from(document.querySelectorAll('.se-inp'));
    const i = inputs.indexOf(el);
    if (i >= 0 && i < inputs.length-1) inputs[i+1].focus();
  }
}
function scorerKey(ev, el) {
  if (ev.key === 'Enter') {
    ev.preventDefault();
    const inputs = Array.from(document.querySelectorAll('.se-inp'));
    const i = inputs.indexOf(el);
    if (i >= 0 && i < inputs.length-1) inputs[i+1].focus();
    else pickHole(Math.min(17, _scoreHoleIdx+1));
  }
}
function pickHole(idx) {
  _scoreHoleIdx = idx;
  renderScorer(document.getElementById('root'));
  window.scrollTo({top:0,behavior:'smooth'});
}
function setNTP(hole, name) {
  if (name) _state.ntp[hole] = name; else delete _state.ntp[hole];
  debouncedSave();
}

/* ---- Admin ---- */
function renderAdmin(root) {
  if (!_isAdmin) {
    root.innerHTML = `<div class="wrap">${headerHTML()}${navHTML('admin')}
      <div class="view"><div class="card" style="max-width:380px;margin:40px auto;text-align:center;">
        <div style="font-size:1.6rem;margin-bottom:10px;">🔐</div>
        <div class="card-h" style="justify-content:center;">Admin Access</div>
        <input id="adminPw" class="inp" type="password" placeholder="Password" style="margin:10px 0;"
          onkeydown="if(event.key==='Enter')adminLogin()">
        <button class="btn btn-gold" onclick="adminLogin()" style="width:100%;">Unlock</button>
      </div></div></div>`;
    return;
  }
  const groupsHTML = _state.groups.map((g, gi) => {
    const slotRows = g.players.map((p, si) => `
      <div class="grp-slot">
        <input class="inp" placeholder="Player name" value="${escH(p.name)}" oninput="updPlayer(${gi},${si},'name',this.value)">
        <input class="inp" type="number" step="0.1" placeholder="HI" value="${p.hi!=null?p.hi:''}" oninput="updPlayer(${gi},${si},'hi',this.value)">
        <select class="inp" onchange="updPlayer(${gi},${si},'gender',this.value)">
          <option value="m" ${p.gender==='m'?'selected':''}>M · Yellow</option>
          <option value="w" ${p.gender==='w'?'selected':''}>W · Red</option>
        </select>
        <label class="mkr">
          <input type="checkbox" ${p.isGuest?'checked':''} onchange="updPlayer(${gi},${si},'isGuest',this.checked)"> Guest
        </label>
      </div>`).join('');
    return `<div class="grp">
      <div class="grp-h">
        <div class="grp-tee">⛳ <input class="tee-inp" type="time" value="${g.teeTime}" onchange="setTeeTime(${gi},this.value)"></div>
        ${groupIsEmpty(g) ? `<button class="btn btn-ghost" style="font-size:.72rem;padding:5px 10px;" onclick="removeGroup(${gi})">✕ Remove tee time</button>` : ''}
      </div>
      ${slotRows}
      <div class="grp-share">
        <button class="btn btn-ghost" style="font-size:.74rem;padding:7px 10px;" onclick="clearGroup(${gi})">Clear scores for this group</button>
      </div>
    </div>`;
  }).join('');

  root.innerHTML = `
    <div class="wrap">
      ${headerHTML()}
      ${navHTML('admin')}
      <div class="save-pill-wrap">
        <div class="save-pill-text">—</div>
        <span class="save-pill">—</span>
      </div>
      <div class="view">
        <div class="card">
          <div class="card-h">📱 Scorer Sign-In Link</div>
          <div style="font-size:.82rem;color:var(--text-mut);margin-bottom:12px;">One link for every marker. They open it, pick their group, pick their name — then score. If they close the tab by mistake, re-opening the link puts them straight back where they were.</div>
          <button class="btn btn-gold" style="width:100%;" onclick="showScorerLink()">📱 Show scorer link + QR</button>
          <button class="btn btn-out" style="width:100%;margin-top:8px;" onclick="location.hash='#/print'">🖨 Printable sign-in sheet (A4)</button>
        </div>
        <div class="card">
          <div class="card-h">👥 Groups & Players</div>
          <div style="font-size:.78rem;color:var(--text-mut);margin-bottom:12px;">Enter names + HI on the morning. No need to pick scorers here — each group's scorer picks themselves when they open the scorer link.</div>
          ${groupsHTML}
          <button class="btn btn-out" style="width:100%;margin-top:4px;" onclick="addGroup()">＋ Add tee time</button>
          <div style="font-size:.72rem;color:var(--text-mut);margin-top:6px;text-align:center;">New tee time is set 8 minutes after the last one — tap the time to change it. Empty tee times can be removed.</div>
        </div>
        <div class="card">
          <div class="card-h">🎯 Nearest the Pin (Par 3s)</div>
          <div style="font-size:.78rem;color:var(--text-mut);margin-bottom:10px;">Live-set from the course by scorers. Override here if a marker name needs fixing.</div>
          ${PAR3_HOLES.map(h => `
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
              <div style="font-family:'Playfair Display',serif;font-weight:800;color:var(--gold);min-width:70px;">Hole ${h}</div>
              <input class="inp" placeholder="— no claim —" value="${escH(_state.ntp[h]||'')}" oninput="if(this.value){_state.ntp[${h}]=this.value}else{delete _state.ntp[${h}]};debouncedSave();">
            </div>`).join('')}
        </div>
        <div class="card">
          <div class="card-h">📺 TV Leaderboard</div>
          <div style="font-size:.82rem;color:var(--text-mut);margin-bottom:10px;">Open this on the laptop plugged into the TV by the 11th tee, then press F11 for fullscreen.</div>
          <button class="btn btn-gold" onclick="location.hash='#/tv'" style="width:100%;">📺 Open TV view</button>
        </div>
        <div class="card">
          <div class="card-h">⚠️ Danger Zone</div>
          <button class="btn btn-dnr" style="width:100%;" onclick="if(confirm('Clear ALL scores + NTP + player data? Cannot be undone.')){_initGroups();_state.ntp={};saveState().then(()=>renderAll());}">Reset event (clear everything)</button>
        </div>
      </div>
    </div>`;
}
function adminLogin() {
  if (document.getElementById('adminPw').value === ADMIN_PW) {
    _isAdmin = true; renderAdmin(document.getElementById('root'));
  } else alert('Incorrect password');
}
function updPlayer(gi, si, key, val) {
  const p = _state.groups[gi].players[si];
  if (key === 'hi') p.hi = val === '' ? null : parseFloat(val);
  else if (key === 'isGuest') p.isGuest = !!val;
  else p[key] = val;
  debouncedSave();
}
function groupIsEmpty(g) { return g.players.every(p => !p.name && p.scores.every(s => s == null)); }
function sortGroups() { _state.groups.sort((a,b) => (a.teeTime||'').localeCompare(b.teeTime||'')); }
function setTeeTime(gi, val) {
  if (!val) return;
  _state.groups[gi].teeTime = val;
  sortGroups(); saveState(); renderAdmin(document.getElementById('root'));
}
function addGroup() {
  const last = _state.groups.map(g => g.teeTime).sort().pop() || '09:52';
  const [hh, mm] = last.split(':').map(Number);
  const t = hh * 60 + mm + 8;
  const time = String(Math.floor(t / 60) % 24).padStart(2,'0') + ':' + String(t % 60).padStart(2,'0');
  const nextId = 'g' + (Math.max(-1, ..._state.groups.map(g => parseInt(g.id.slice(1)) || 0)) + 1);
  _state.groups.push({ id: nextId, teeTime: time, scorerSlot: 0,
    players: [0,1,2,3].map(() => ({ name:'', hi:null, gender:'m', isGuest:false, isPro:false, scores:new Array(18).fill(null) })) });
  sortGroups(); saveState(); renderAdmin(document.getElementById('root'));
}
function removeGroup(gi) {
  const g = _state.groups[gi];
  if (!groupIsEmpty(g)) { alert('Clear the names and scores in this group first.'); return; }
  if (!confirm('Remove the ' + g.teeTime + ' tee time?')) return;
  _state.groups.splice(gi, 1); saveState(); renderAdmin(document.getElementById('root'));
}
function setScorer(gi, slot) { _state.groups[gi].scorerSlot = slot; debouncedSave(); }
function clearGroup(gi) {
  if (!confirm('Clear scores for this group?')) return;
  _state.groups[gi].players.forEach(p => p.scores = new Array(18).fill(null));
  saveState().then(() => renderAdmin(document.getElementById('root')));
}
function showScorerLink() {
  const url = location.origin + location.pathname + '#/score';
  const existing = document.querySelector('.modal'); if (existing) existing.remove();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div class="modal-c">
      <h2>Scorer sign-in link</h2>
      <div class="sub">One link for every scorer. They'll pick their group and name.</div>
      <div id="qrbox"></div>
      <div class="modal-link">${url}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-out" style="flex:1;" onclick="navigator.clipboard.writeText('${url}').then(()=>alert('Copied!'))">📋 Copy link</button>
        <button class="btn btn-gold" style="flex:1;" onclick="this.closest('.modal').remove()">Close</button>
      </div>
      <button class="btn btn-out" style="width:100%;margin-top:8px;" onclick="this.closest('.modal').remove();location.hash='#/print'">🖨 Printable sign</button>
    </div>`;
  m.addEventListener('click', (e) => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  renderQR(document.getElementById('qrbox'), url, 240);
}

/* ---- QR helper (library, with image fallback) ---- */
function renderQR(el, url, size) {
  if (!el) return;
  el.innerHTML = '';
  try {
    if (window.QRCode) {
      new QRCode(el, { text:url, width:size, height:size, colorDark:'#122344', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
      return;
    }
  } catch(e) { console.error('QR lib failed', e); el.innerHTML = ''; }
  const img = new Image();
  img.width = size; img.height = size; img.alt = 'QR code';
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&margin=0&data=' + encodeURIComponent(url);
  el.appendChild(img);
}

/* ---- Headers / nav ---- */
function headerHTML() {
  return `<div class="hdr">
    <div class="hdr-brand">
      <img class="hdr-logo" src="club-logo.png" alt="" onerror="this.style.display='none'">
      <div>
        <div class="hdr-title">Autumn Roll Up</div>
        <div class="hdr-sub">STANMORE GC · 5 NOV 2026</div>
      </div>
    </div>
    <div class="hdr-chip">⛳ Stableford</div>
  </div>`;
}
function navHTML(current) {
  const items = [['leaderboard','#/','Leaderboard'],['admin','#/admin','Admin']];
  return `<div class="nav">${items.map(([k,h,l]) => `<a class="nav-item ${current===k?'active':''}" href="${h}">${l}</a>`).join('')}</div>`;
}
function escH(s){ if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Boot ---- */
(async function(){ parseRoute(); await loadState(); renderAll(); })();
</script>
